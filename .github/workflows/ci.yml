name: Bridge CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: bridge-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Public contributions use disposable hosted machines, never the private runner.
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact candidate and Node major
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node -p 'process.versions.node.split(".")[0]')" = "$EXPECTED_NODE"
          echo "Candidate: $EXPECTED_SHA; Node: $(node --version); runner: $RUNNER_NAME" >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject known high-risk dependency advisories
        if: matrix.node == 24
        run: npm audit --audit-level=high
      - run: npm run check
      - name: Keep public core independent of private billing
        if: github.ref == 'refs/heads/main' || github.event.pull_request.base.ref == 'main'
        run: node bin/check-core-boundary.mjs
      - run: npm test
      - run: node bin/bridge-runner.mjs validate-host-policy --host-policy examples/host.json
      - name: Standalone npm pack / npx / cache-independent daemon
        run: node bin/test-host-package.mjs
      - name: Packaged foreground TLS and native-exec round trip
        run: node bin/test-host-portable-package.mjs
      # Native persistent user-service lifecycle is an operator-local acceptance step.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bridge-host-preview-${{ matrix.os }}-node-${{ matrix.node }}
          path: dist/host-preview/
          if-no-files-found: error
          retention-days: 14
